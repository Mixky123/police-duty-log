# render.yaml — ไฟล์ตั้งค่าสำหรับ deploy ขึ้น Render แบบอัตโนมัติ (Blueprint)
# เมื่อเชื่อม GitHub repo นี้กับ Render และเลือก "Blueprint" ระบบจะอ่านไฟล์นี้
# แล้วสร้างทั้งเว็บเซอร์วิสและฐานข้อมูล PostgreSQL ให้อัตโนมัติ

services:
  # เว็บเซอร์วิส (Flask + gunicorn)
  - type: web
    name: police-duty-log
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      # คีย์ลับของ session ให้ Render สุ่มสร้างให้อัตโนมัติ
      - key: SECRET_KEY
        generateValue: true
      # connection string ของฐานข้อมูล ตั้งค่าเองในหน้า Dashboard ของ Render
      # (Environment > DATABASE_URL) โดยใช้ค่าจาก Neon
      # ไม่ใช้ฐานข้อมูลฟรีของ Render เพราะหมดอายุใน 30 วันแล้วเว็บจะล่ม
      - key: DATABASE_URL
        sync: false
